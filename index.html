<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>CleanTok - تحميل TikTok بدون علامة مائية</title>
<meta name="description" content="CleanTok أداة مجانية لتحميل فيديوهات TikTok بدون علامة مائية بسرعة وسهولة." />
<meta name="keywords" content="تحميل تيك توك بدون علامة, TikTok بدون شعار, تحميل فيديو تيك توك" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, #1d2671, #c33764);
  min-height: 100vh;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.box {
  background: #fff;
  padding: 35px;
  border-radius: 18px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

h1 {
  margin: 0;
  font-size: 32px;
  color: #1d2671;
}

p {
  color: #555;
  font-size: 15px;
  margin-top: 10px;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
  outline: none;
}

input:focus {
  border-color: #c33764;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  background: #c33764;
  color: #fff;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #a52b55;
}
</style>
</head>
<body>

<div class="box">
  <h1>CleanTok</h1>
<p>تحميل فيديوهات TikTok بدون علامة مائية بسهولة مجاني</p>

  <input id="tiktokUrl" placeholder="https://www.tiktok.com/..." />

<select id="quality" style="width:100%;padding:10px;margin-bottom:10px;display:none;">
  <option value="hd">HD بدون علامة مائية</option>
  <option value="sd">SD بدون علامة مائية</option>
</select>

<button onclick="analyze()">تحليل الرابط</button>

<a id="downloadBtn" style="display:none;margin-top:10px;display:block;text-decoration:none;">
  <button>تحميل الفيديو</button>
</a>

</div>

<script>
function go(){
  let url = document.getElementById("url").value;
  if(!url){
    alert("من فضلك ضع رابط الفيديو");
    return;
  }
  window.open("https://ssstik.io/ar?url=" + encodeURIComponent(url), "_blank");
}
</script>
  <script>
function analyze() {
  const url = document.getElementById("tiktokUrl").value;
  if (!url.includes("tiktok.com")) {
    alert("ضع رابط تيك توك صحيح");
    return;
  }

  document.getElementById("quality").style.display = "block";
  document.getElementById("downloadBtn").style.display = "block";

  document.getElementById("downloadBtn").href = "#";
}
</script>

</body>
</html>
