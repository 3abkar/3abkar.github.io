<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>CleanTok</title>
<style>
body {
  background: linear-gradient(120deg,#3a1c71,#d76d77,#ffaf7b);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
}
.box {
  background:#fff;
  padding:25px;
  width:320px;
  border-radius:15px;
  text-align:center;
}
input {
  width:100%;
  padding:10px;
  margin:10px 0;
}
button {
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  background:#d63d6c;
  color:white;
  font-size:16px;
  cursor:pointer;
  border-radius:8px;
}
#downloads {
  display:none;
}
</style>
</head>

<body>
<div class="box">
  <h2>CleanTok</h2>
  <p>تحميل فيديوهات تيك توك بدون علامة مائية</p>

  <input id="url" placeholder="ضع رابط TikTok هنا">
  <button onclick="analyze()">تحليل الرابط</button>

  <div id="downloads">
    <button onclick="download('hd')">تحميل HD</button>
    <button onclick="download('sd')">تحميل SD</button>
  </div>
</div>

<script>
function analyze(){
  const url = document.getElementById("url").value;
  if(!url.includes("tiktok")){
    alert("رابط غير صالح");
    return;
  }
  document.getElementById("downloads").style.display="block";
}

function download(q){
  const url = document.getElementById("url").value;

  // API مؤقت (مش ssstiktok)
  window.open(
    `https://api.tikmate.app/api/lookup?url=${encodeURIComponent(url)}`,
    "_blank"
  );
}
</script>
</body>
</html>
